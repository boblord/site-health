# Copy to .github/workflows/site-health.yml in a site repository and set `url`.
name: Site health

on:
  pull_request:
  workflow_dispatch:
  # For a site that is not in the public central list, uncomment to check the
  # live site weekly from this repository instead:
  # schedule:
  #   - cron: '23 10 * * 2'

jobs:
  site-health:
    uses: boblord/site-health/.github/workflows/site-check.yml@v2
    permissions:
      contents: read
      issues: write
      pull-requests: read # PR-1: pull requests left open
    with:
      url: https://example.org
      # Start in warning mode. Set to true once the site passes, to block
      # pull requests that would break a required check.
      enforce: false
      open-issue: ${{ github.event_name != 'pull_request' }}
