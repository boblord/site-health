name: Weekly site check

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Opens, updates, or closes one issue per site. Site failures do not fail
      # the workflow; the issues are the report.
      - run: node bin/site-health.js run --config sites.yml --issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # PR-1: which repository belongs to each site, as JSON {"host": "owner/name"},
          # kept in a repository variable so private repository names stay out of
          # this public repository. The secret is a fine-grained token with
          # read-only access to pull requests in those repositories.
          SITE_HEALTH_REPOS: ${{ vars.SITE_HEALTH_REPOS }}
          SITE_HEALTH_PULLS_TOKEN: ${{ secrets.SITE_HEALTH_PULLS_TOKEN }}
