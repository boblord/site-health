name: Weekly site check

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Opens, updates, or closes one issue per site. Site failures do not fail
      # the workflow; the issues are the report.
      - run: node bin/site-health.js run --config sites.yml --issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # UPKEEP-1: which repository belongs to each site, as JSON {"host": "owner/name"}.
          # A secret, not a variable: GitHub prints variables in this public repository's
          # run logs, and the repository names may be private. The token secret is a
          # fine-grained token for those repositories with read-only Pull requests,
          # Actions and Contents access (UPKEEP-1, -2 and -3).
          SITE_HEALTH_REPOS: ${{ secrets.SITE_HEALTH_REPOS }}
          SITE_HEALTH_PULLS_TOKEN: ${{ secrets.SITE_HEALTH_PULLS_TOKEN }}
